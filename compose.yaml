services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/finance_tracker
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-finance_dev}
      JPA_DDL_AUTO: validate
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      JWT_ISSUER: finance-tracker
      JWT_EXPIRATION: PT8H
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  finance-data:
