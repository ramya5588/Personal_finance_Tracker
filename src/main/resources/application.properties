spring.application.name=finance-tracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.security.jwt-secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
app.security.jwt-issuer=${JWT_ISSUER:finance-tracker}
app.security.jwt-expiration=${JWT_EXPIRATION:PT8H}
